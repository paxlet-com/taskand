apiVersion: taskand.dev/v1
kind: FederationSpec
metadata:
  standard: "taskand-v0.20-federation"
  version: "1.0.0"

rules:
  registry-identity:
    uriFormat: "proc://<org>/<registry-name>/<capability>/<version>"
    examples:
      - "proc://taskand.dev/developer/summarize/v1"
      - "proc://taskand.dev/web/navigate/v1"
      - "proc://taskand.dev/chat/message/v1"

  serving:
    required-process: "proc://taskand.dev/registry/serve/v1"
    endpoints:
      - { path: "/.well-known/catalog.json", method: GET, desc: "katalog procesów rejestru" }
      - { path: "/proc-catalog.json", method: GET, desc: "pełny katalog z sumami SHA-256" }
      - { path: "/proc/<path>", method: GET, desc: "pliki procesów rejestru" }

  discovery:
    method: "GET /.well-known/catalog.json"
    response: { processes: [{ uri, hash, runtimes }] }

  exchange:
    protocol: "CloudEvents 1.0"
    steps:
      - discover
      - verify-sha256
      - check-grants
      - execute-fail-closed

  grants:
    register-to-own: true
    consume-from-other: "consume-from-registry:<name>"
    discover: public
