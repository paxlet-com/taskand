apiVersion: taskand.dev/v1
kind: Capsule
metadata:
  name: taskand-demo
  version: "1.0.0"
spec:
  role: worker
  processes:
    - uri: proc://taskand.dev/registry/serve/v1
      role: worker
      grants: [run]
    - uri: proc://taskand.dev/hello-world/v1
      role: worker
      grants: [execute-proc]
  permissions:
    source: grants.yaml
    defaults:
      deny: [policy-write, claims-delete, git-push, self-restart]
  evolution:
    delegated-to: capsule:taskand-developer
    twin: { retries: 3 }
  deploy:
    policy: twin-first
    health: { on-fail: auto-rollback }
  storage:
    kind: git
    versioning: { mode: commits+tags, tagPrefix: capsule- }
  runtime:
    repo-mount: read-only
    self-modification: denied
