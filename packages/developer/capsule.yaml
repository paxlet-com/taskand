apiVersion: taskand.dev/v1
kind: Capsule
metadata:
  name: taskand-developer
  version: "1.0.0"
  description: "Kapsuła dewelopera taskand — generator planów, pętla samonaprawy i ewolucji"

spec:
  role: agent

  processes:
    - uri: proc://taskand.dev/dev/plan/v1
      role: worker
      grants: [execute-proc]

    - uri: proc://taskand.dev/dev/heal/v1
      role: orchestrator
      grants: [execute-proc]
      calls:
        - proc://taskand.dev/dev/plan/v1

  permissions:
    source: grants.yaml
    defaults:
      deny: [policy-write, claims-delete, git-push, self-restart]

  evolution:
    delegated-to: capsule:taskand-developer
    twin:
      retries: 3
    on-exhausted: keep-previous + report

  deploy:
    policy: twin-first
    health:
      on-fail: auto-rollback

  storage:
    kind: git
    versioning:
      mode: commits+tags
      tagPrefix: capsule-developer-

  runtime:
    repo-mount: read-only
    self-modification: denied
