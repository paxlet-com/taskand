apiVersion: taskand.dev/v1
kind: Capsule
metadata:
  name: taskand-chat
  version: "1.0.0"
  description: "Kapsuła konwersacji, pamięci LLM i interfejsu głosowego taskand"

spec:
  role: agent

  processes:
    - uri: proc://taskand.dev/registry/serve/v1
      role: worker
      grants: [run]
    - uri: proc://taskand.dev/chat/message/v1
      role: worker
      grants: [execute-proc]

    - uri: proc://taskand.dev/chat/voice/v1
      role: worker
      grants: [execute-proc]

  permissions:
    source: grants.yaml
    defaults:
      deny: [policy-write, claims-delete, git-push, self-restart]

  evolution:
    delegated-to: capsule:taskand-developer
    twin:
      retries: 3
    on-exhausted: keep-previous + report

  deploy:
    policy: twin-first
    health:
      on-fail: auto-rollback

  storage:
    kind: git
    versioning:
      mode: commits+tags
      tagPrefix: capsule-chat-

  runtime:
    repo-mount: read-only
    self-modification: denied
