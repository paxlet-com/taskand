apiVersion: taskand.dev/v1
kind: Capsule
metadata:
  name: taskand-bootstrap
  version: "1.0.0"
  description: "Kapsuła rozruchowa, onboarding środowiska i handover do taskand-core"

spec:
  role: bootstrap

  processes:
    - uri: proc://taskand.dev/registry/serve/v1
      role: worker
      grants: [run]
    - uri: proc://taskand.dev/bootstrap/onboarding/v1
      role: worker
      grants: [execute-proc]
    - uri: proc://taskand.dev/bootstrap/handover/v1
      role: worker
      grants: [execute-proc]

  permissions:
    source: grants.yaml
    defaults:
      deny: [policy-write, claims-delete, git-push, self-restart]

  evolution:
    delegated-to: capsule:taskand-developer
    twin:
      retries: 3
    on-exhausted: keep-previous + report

  deploy:
    policy: twin-first
    health:
      on-fail: auto-rollback

  storage:
    kind: git
