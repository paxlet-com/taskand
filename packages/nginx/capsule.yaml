apiVersion: taskand.dev/v1
kind: Capsule
metadata:
  name: taskand-nginx
  version: "1.0.0"
  description: "Adapter dozbrojonej usługi nginx w architekturze taskand"

spec:
  role: external-service
  processes:
    - uri: proc://taskand.dev/nginx/status/v1
      role: worker
      grants: [execute-proc]

  permissions:
    source: grants.yaml
    defaults:
      deny: [policy-write, claims-delete, git-push, self-restart]

  evolution:
    delegated-to: capsule:taskand-developer
    twin:
      retries: 3
    on-exhausted: keep-previous + report
