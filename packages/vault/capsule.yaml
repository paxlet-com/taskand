apiVersion: taskand.dev/v1
kind: Capsule
metadata:
  name: taskand-vault
  version: "1.0.0"
  description: "Sejf poświadczeń, szyfrowany magazyn AES-256-GCM, purpose-scoped brokering tokenów LLM i audyt dostępu"

spec:
  role: security

  processes:
    - uri: proc://taskand.dev/registry/serve/v1
      role: worker
      grants: [run]
    - uri: proc://taskand.dev/vault/secrets/v1
      role: worker
      grants: [execute-proc]
    - uri: proc://taskand.dev/vault/chat/v1
      role: worker
      grants: [execute-proc]

  permissions:
    source: grants.yaml
    defaults:
      deny: [policy-write, claims-delete, git-push, self-restart]

  evolution:
    delegated-to: capsule:taskand-developer
    twin:
      retries: 3
    on-exhausted: keep-previous + report

  deploy:
    policy: twin-first
    health:
      on-fail: auto-rollback

  storage:
    kind: git
