apiVersion: taskand.dev/v1
kind: Capsule
metadata:
  name: taskand-doctor
  version: "1.0.0"
  description: "Kapsuła diagnostyczna, monitorowanie zdrowia usług i delegowanie zadań naprawczych do taskand-developer"

spec:
  role: doctor

  processes:
    - uri: proc://taskand.dev/registry/serve/v1
      role: worker
      grants: [run]
    - uri: proc://taskand.dev/doctor/diagnose/v1
      role: worker
      grants: [execute-proc]
    - uri: proc://taskand.dev/doctor/prescribe/v1
      role: worker
      grants: [execute-proc]
    - uri: proc://taskand.dev/doctor/chat/v1
      role: worker
      grants: [execute-proc]
    - uri: proc://taskand.dev/doctor/spawn/v1
      role: worker
      grants: [execute-proc]

  permissions:
    source: grants.yaml
    defaults:
      deny: [policy-write, claims-delete, git-push, self-restart]

  evolution:
    delegated-to: capsule:taskand-developer
    twin:
      retries: 3
    on-exhausted: keep-previous + report

  deploy:
    policy: twin-first
    health:
      on-fail: auto-rollback

  storage:
    kind: git
