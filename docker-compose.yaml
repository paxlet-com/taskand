# taskand · docker-compose.yaml v0.4
# controller: nucleus (ten sam Dockerfile w trybie daemon) · planista: .env
name: taskand

services:
  nucleus:
    build: .
    container_name: taskand-nucleus
    env_file:
      - path: .env          # klucz GLM-5.3 — runtime, nigdy do obrazu
        required: false     # działa też bez .env (plan lokalny)
    environment:
      TASKAND_HOST_HOME: ${HOME}   # rozwinie się NA HOŚCIE (montaż gh w zadaniach)
      TASKAND_HOST_DIR: ${TASKAND_HOST_DIR:-.}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${TASKAND_HOST_DIR:-.}:/taskand"
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: taskand-gateway
    ports: ["8077:8077"]   # Uniwersalna bramka REST API dla zadan, logow i Digital Twin
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${TASKAND_HOST_DIR:-.}:/taskand"
      - "${HOME:-/home/tom}:${HOME:-/home/tom}"
    restart: unless-stopped

  landing:
    build: ./landing
    container_name: taskand-landing
    ports: ["8090:80"]
    volumes:
      - "./landing:/usr/share/nginx/html:ro"
    restart: unless-stopped

  task-t1789216176:
    build: ./evolution/t1789216176
    volumes:
      - /home/tom/.config/gh:/root/.config/gh:ro
    restart: "no"
