version: "3.9"

services:
  # ── BOOTSTRAP (zygota — startuje system) ──
  bootstrap:
    build: .
    environment:
      - TASKAND_LLM_API_KEY=${TASKAND_LLM_API_KEY:-}
      - TASKAND_LLM_MODEL=${TASKAND_LLM_MODEL:-glm-5.3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./generated:/taskand/generated
      - ./log:/taskand/log
    restart: "no"

  # ── GATEWAY (jeden punkt wejścia REST API) ──
  gateway:
    image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
    command: sh -c "apk add --no-cache nodejs curl && python3 /app/server.py"
    # host: skanowanie LAN i sondy usług widzą sieć hosta; port 8077 bez mapowania
    network_mode: host
    environment:
      - TASKAND_LLM_API_KEY=${TASKAND_LLM_API_KEY:-}
      - TASKAND_LLM_MODEL=${TASKAND_LLM_MODEL:-glm-5.3}
      - TASKAND_LLM_ENDPOINT=${TASKAND_LLM_ENDPOINT:-https://api.z.ai/api/paas/v4/chat/completions}
      - TASKAND_AUTH_TOKEN=${TASKAND_AUTH_TOKEN:-}
      - TASKAND_VAULT_KEY=${TASKAND_VAULT_KEY:-}
      - TASKAND_LLM_REASONING=${TASKAND_LLM_REASONING:-}
      # 127.0.0.1 = tylko ten host; 0.0.0.0 = LAN/federacja (wymaga własnych tokenów w grants.yaml)
      - TASKAND_BIND=${TASKAND_BIND:-127.0.0.1}
      - TASKAND_BROWSER_CDP=${TASKAND_BROWSER_CDP:-http://127.0.0.1:9222}
      - TASKAND_BROWSER_NOVNC=${TASKAND_BROWSER_NOVNC:-http://127.0.0.1:3010}
      - TASKAND_NODE=${TASKAND_NODE:-}
      - TASKAND_DEBUG=${TASKAND_DEBUG:-}
    volumes:
      # A local preview can retain the primary runtime's complete package registry.
      - ${TASKAND_GENERATED_ROOT:-./generated}:/taskand/generated
      - ./generated/planner/plan/taskand.dev/v1:/taskand/generated/planner/plan/taskand.dev/v1:ro
      - ./generated/planner/registry.json:/taskand/generated/planner/registry.json:ro
      - ${TASKAND_DATA_ROOT:-.}/genome.yaml:/taskand/genome.yaml
      - ${TASKAND_DATA_ROOT:-.}/grants.yaml:/taskand/grants.yaml:ro
      - ${TASKAND_DATA_ROOT:-.}/.env:/taskand/.env:ro
      - ${TASKAND_DATA_ROOT:-.}/vault:/taskand/vault
      - ${TASKAND_DATA_ROOT:-.}/web-root:/taskand/web-root
      - ./index.html:/taskand/index.html
      - ./gateway.py:/app/server.py:ro
      - ./gateway:/app/gateway:ro
      - ${TASKAND_DATA_ROOT:-.}/log:/taskand/log
    restart: unless-stopped

  # ── LANDING (Web Cockpit) ──
  landing:
    image: nginx:alpine@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    ports: ["8090:80"]
    restart: unless-stopped

  # ── VM BROWSER (digital twin — test przeglądarki noVNC) ──
  vm-browser:
    image: lscr.io/linuxserver/chromium:latest@sha256:54a61718733c82ac041e7c84543283419b06ab0d6439eef5c20b1f6a53b8dcd0
    ports: ["3010:3000", "127.0.0.1:9222:9223"]
    environment:
      # CDP dla browser/session/v1 (na hoście tylko 127.0.0.1:9222)
      - CHROME_CLI=--remote-debugging-address=0.0.0.0 --remote-debugging-port=9222 --user-data-dir=/config/taskand-cdp-profile
    volumes:
      # Chromium z oknem słucha CDP tylko na loopback kontenera → forwarder 9223 → 9222
      - ./vms/browser/cdp-forward:/custom-services.d/cdp-forward:ro
      # Usuń wyłącznie nieaktualne blokady profilu przed startem Chromium.
      - ./vms/browser/cdp-init:/custom-cont-init.d:ro
      # Start Chromium dopiero po gotowości socketu Wayland.
      - ./vms/browser/labwc-autostart:/config/.config/labwc/autostart:ro
    shm_size: "2gb"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9223/json/version >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    labels:
      org.taskand.device: "vm-test"
