organisms:
  - name: chat
    processes:
      - { uri: proc://taskand.dev/chat/message/v1, desc: "odpowiada na wiadomości" }

  - name: doctor
    processes:
      - { uri: proc://taskand.dev/doctor/diagnose/v1, desc: "sprawdza stan usług" }
      - { uri: proc://taskand.dev/doctor/prescribe/v1, desc: "wystawia recepty" }

  - name: developer
    processes:
      - { uri: proc://taskand.dev/dev/chat/v1, desc: "interfejs konwersacyjny developera (WYKONUJE, nie wyjaśnia)" }
      - { uri: proc://taskand.dev/dev/execute/v1, desc: "silnik bezpośredniego wykonywania intencji i zadań" }
      - { uri: proc://taskand.dev/dev/codegen/v1, desc: "generuje kod przez LLM" }
      - { uri: proc://taskand.dev/developer/spawn/v1, desc: "powołuje nowe organizmy" }
      - { uri: proc://taskand.dev/dev/llm/v1, desc: "Jedyny klient LLM (Z.ai/OpenAI-compatible), tryb tekst/JSON" }
      - { uri: proc://taskand.dev/dev/act/v1, desc: "Wykonuje zadanie usera: wybiera proces z katalogu lub ewoluuje nowy" }
      - { uri: proc://taskand.dev/dev/evolve/v1, desc: "Ewolucja: LLM generuje proces, guard, test kontraktu, rejestracja" }
      - { uri: proc://taskand.dev/dev/composite/v1, desc: "Zadania złożone: planner → validator → evolve → orchestrator" }
      - { uri: proc://taskand.dev/dev/file-router/v1, desc: "Pytania o pliki: istnienie i rozmiar ścieżki z promptu" }

  - name: planner
    processes:
      - { uri: proc://taskand.dev/planner/plan/v1, desc: "dekomponuje złożone zadania na Blueprint" }

  - name: validator
    processes:
      - { uri: proc://taskand.dev/validator/resolve/v1, desc: "waliduje graf, cykle i rozwiązuje URI z katalogu" }

  - name: orchestrator
    processes:
      - { uri: proc://taskand.dev/orchestrator/execute/v1, desc: "trwały silnik asynchronicznej orkiestracji" }

  - name: monitor
    processes:
      - { uri: proc://taskand.dev/monitor/cpu/v1, desc: "monitor obciążenia procesora CPU" }

  - name: alert
    processes:
      - { uri: proc://taskand.dev/alert/telegram/v1, desc: "adapter powiadomień Telegram z ochroną sekretów" }

  - name: web
    processes:
      - { uri: proc://taskand.dev/web/serve/v1, desc: "serwuje interfejs Web Cockpit na :8090" }

  - name: browser
    processes:
      - { uri: proc://taskand.dev/browser/session/v1, desc: "steruje przeglądarką (noVNC :3010)" }

  - name: vault
    processes:
      - { uri: proc://taskand.dev/vault/secrets/v1, desc: "zarządza sekretami (AES-256-GCM)" }

  - name: file-ops
    processes:
      - { uri: proc://taskand.dev/file/ops/v1, desc: "zarządza plikami na węzłach" }

  - name: hw-monitor
    processes:
      - { uri: proc://taskand.dev/hw/monitor/v1, desc: "telemetria sprzętu i GPIO" }

  - name: admin
    processes:
      - { uri: proc://taskand.dev/admin/chat/v1, desc: "zarządzanie i telemetria systemu" }
