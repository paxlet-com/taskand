organisms:
  - name: chat
    processes:
      - { uri: proc://taskand.dev/chat/message/v1, desc: "odpowiada na wiadomości" }
      - { uri: proc://taskand.dev/chat/voice/v1, desc: "zamienia mowę na akcję" }

  - name: doctor
    processes:
      - { uri: proc://taskand.dev/doctor/diagnose/v1, desc: "sprawdza stan usług" }
      - { uri: proc://taskand.dev/doctor/prescribe/v1, desc: "wystawia recepty" }

  - name: developer
    processes:
      - { uri: proc://taskand.dev/dev/codegen/v1, desc: "generuje kod przez LLM" }
      - { uri: proc://taskand.dev/dev/spawn/v1, desc: "powołuje nowe organizmy" }

  - name: browser
    processes:
      - { uri: proc://taskand.dev/browser/session/v1, desc: "steruje przeglądarką (noVNC)" }

  - name: vault
    processes:
      - { uri: proc://taskand.dev/vault/secrets/v1, desc: "zarządza sekretami" }

  - name: file-ops
    processes:
      - { uri: proc://taskand.dev/file/ops/v1, desc: "zarządza plikami na węzłach" }

  - name: hw-monitor
    processes:
      - { uri: proc://taskand.dev/hw/monitor/v1, desc: "telemetria sprzętu i GPIO" }
