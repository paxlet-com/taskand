apiVersion: taskand.dev/v1
kind: Strategy
metadata:
  name: default-flow-strategy
  revision: 1
spec:
  execution_order:
    - proc://taskand.dev/browser/session/v1
    - proc://taskand.dev/web/navigate/v1
    - proc://taskand.dev/web/analyze/v1
  retry_policy:
    max_attempts: 3
    backoff_ms: 500
