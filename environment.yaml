version: "1.0.0"
project:
  name: "taskand-glm53"
  slug: "taskand-glm53"
  org: "semcod"
  repository: "https://github.com/semcod/taskand-glm53.git"
  default_branch: "main"
  version: "0.4.2"
  description: "Autonomiczny system zadań sterowany procesami w Dockerfile, Digital Twin i Definition of Done"

runtime:
  os: "linux"
  architecture: "aarch64"
  docker_compose: true
  ports:
    gateway_api: 8077
    landing_web: 8090
  llm:
    model: "glm-5.3"
    endpoint: "https://api.z.ai/api/paas/v4/chat/completions"
    env_key: "TASKAND_LLM_API_KEY"

security:
  secrets_strategy: "environment_injection"
  env_file: ".env"
  credential_mounts:
    github_cli:
      source: "~/.config/gh"
      target: "/root/.config/gh"
      mode: "ro"
  guidelines:
    - "Nigdy nie wpisuj haseł i kluczy bezpośrednio w plikach Dockerfile (zapobiega wyciekom w git i warstwach obrazu)"
    - "Sekrety przekazuj jako zmienne środowiskowe z .env lub Vault w fazie runtime (docker run -e / docker-compose environment)"
    - "W fazie budowania obrazu (build-time) używaj wyłącznie BuildKit Secret Mount: RUN --mount=type=secret,id=..."

capabilities:
  - "docker-in-docker"
  - "github-cli"
  - "digital-twin-sandbox"
  - "definition-of-done-validator"
  - "history-sha256-rollback"
  - "wellmanifest-logs"
  - "wellmanifest-llm"
