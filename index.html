<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>taskand v2.0</title>
  <style>
    body {
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      max-width: 680px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #fafafa;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      background: #eef2ff;
      color: #3730a3;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      font: 16px monospace;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      background: #fff;
    }
    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
    }
    #out {
      padding: 14px;
      border: 1px solid #e2e8f0;
      background: #fff;
      border-radius: 6px;
      margin-top: 14px;
      min-height: 120px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
      color: #1e293b;
    }
    .hints {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
    }
    .hints code {
      background: #e2e8f0;
      padding: 2px 4px;
      border-radius: 3px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>taskand v2.0</h1>
  <div class="badge">Minimalny, auto-mnożący się ekosystem organizmów</div>
  
  <input id="msg" placeholder='np. "sprawdź czy wszystko działa" lub "stwórz proces"'>
  <div class="hints">
    Szybkie zlecenia: 
    <code onclick="quick('sprawdź czy wszystko działa')">doctor: sprawdź</code> · 
    <code onclick="quick('stwórz proces liczący słowa')">dev: stwórz</code> · 
    <code onclick="quick('sejf status')">vault: status</code> · 
    <code onclick="quick('otwórz https://example.com')">browser: noVNC</code>
  </div>

  <div id="out">System gotowy. Wpisz prompt i naciśnij Enter...</div>

  <script>
    function quick(text) {
      document.getElementById('msg').value = text;
      runChat(text);
    }
    async function runChat(msg) {
      const out = document.getElementById('out');
      out.textContent = '... przetwarzanie promptu w organizmie taskand v2.0 ...';
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });
        const j = await r.json();
        out.textContent = j.reply || JSON.stringify(j, null, 2);
      } catch (err) {
        out.textContent = 'Błąd komunikacji z Gateway: ' + err.message;
      }
    }

    document.getElementById('msg').addEventListener('keydown', async e => {
      if (e.key === 'Enter') {
        const msg = e.target.value.trim();
        if (!msg) return;
        e.target.value = '';
        await runChat(msg);
      }
    });
  </script>
</body>
</html>
